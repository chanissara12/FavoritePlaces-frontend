<app-modal>
    <div>
        <app-close-btn />
        <div class="flex flex-col m-8">
            <form (ngSubmit)="onSubmit()">
                <div class="flex justify-center">
                    <p class="text-4xl font-bold">Edit post</p>
                </div>
                
                <!-- <input class="m-2" type="text"> -->
                <p class="m-2">
                    <label for="title">Place name: </label>
                    <input class="m-2 border rounded-xs" type="text" id="title" name="title" [(ngModel)]="enteredTitle" />
                </p>
                <p class="m-2">
                    <label for="description">Description: </label>
                    <textarea class="w-full border rounded-xs" name="description" [(ngModel)]="enteredAlt"></textarea>
                </p>

                <!-- <h2 class="font-bold text-2xl m-2">{{ post?.title }}</h2> -->

                <img class="m-2" [src]="post?.imgSrc" [alt]="post?.imgAlt">
                <div class="flex justify-end">
                    <button class="rounded-2xl bg-blue-300 hover:bg-blue-500 cursor-pointer p-2 font-bold" type="submit">Submit</button>
                </div>  
            </form>
        </div>
    </div>
</app-modal>
